[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photostory"
version = "0.1.0"
description = "Weekly agent that turns 10 random family photos into captions, an imaginary story, a quiz and a silly song."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "boto3>=1.34",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
share = ["playwright>=1.40"]  # + `python -m playwright install chromium` and ffmpeg
dev = ["pytest>=8"]

[project.scripts]
photostory = "photostory.cli:main"

[tool.setuptools.packages.find]
include = ["photostory*"]

[tool.setuptools.package-data]
photostory = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
